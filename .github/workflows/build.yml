name: APK Derle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk GolHaber.apk

      - name: APK'yı doğrula
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging GolHaber.apk | grep -E "^package|sdkVersion|application-label:"
          "$BT/apksigner" verify --print-certs GolHaber.apk | head -3
          unzip -l GolHaber.apk | grep -c "\.ogg" | xargs -I{} sh -c 'echo "ses dosyası: {}"; [ {} -ge 4 ]'
          unzip -p GolHaber.apk 'classes*.dex' | grep -a -q "CheckWorker" && echo "CheckWorker korunmuş"
          ls -la GolHaber.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GolHaber-apk
          path: GolHaber.apk

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GolHaber ${{ github.ref_name }}
          files: GolHaber.apk
          body_path: docs/RELEASE.md
